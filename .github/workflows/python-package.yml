name: Build APK Nactivo con Buildozer

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04  # Usamos 22.04 por estabilidad estricta con Android SDK y Buildozer

    steps:
    - name: Checkout del código
      uses: actions/checkout@v4

    - name: Configurar JDK 17 (Requerido para Android SDK moderno)
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Configurar Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Instalar dependencias del sistema de Ubuntu
      run: |
        sudo apt-get update
        # 1. Instalamos primero libunwind-dev para solucionar la dependencia rota de GStreamer
        sudo apt-get install -y libunwind-dev
        
        # 2. Instalamos el resto de librerías del sistema requeridas por Buildozer
        sudo apt-get install -y build-essential git ffmpeg libgstreamer1.0-dev \
          gstreamer1.0-plugins-base gstreamer1.0-plugins-good gstreamer1.0-plugins-bad \
          gstreamer1.0-plugins-ugly gstreamer1.0-libav libgstreamer-plugins-base1.0-dev \
          libasound2-dev libportaudio2 libportaudiocpp0 portaudio19-dev libffi-dev libssl-dev \
          cmake autoconf libtool pkg-config zlib1g-dev libncurses5-dev libgdbm-dev \
          libnss3-dev libreadline-dev uuid-dev tar docutils checkinstall libsqlite3-dev \
          g++ unzip zip aidl

    - name: Instalar Buildozer y Cython en el Runner
      run: |
        pip install --upgrade pip
        pip install buildozer cython==3.0.8 sh

    - name: Compilar APK con Buildozer (Logs Detallados)
      run: |
        # Ejecuta buildozer en modo "verbose" para ver cada paso en vivo
        buildozer -v android debug

    - name: Subir el APK generado como Artefacto
      uses: actions/upload-artifact@v4
      with:
        name: App-Colegio-Dante-APK
        path: bin/*.apk
