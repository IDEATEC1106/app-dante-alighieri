name: Compilar APK con Buildozer

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Descargar Código del Repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Instalar Dependencias del Sistema
        run: |
          sudo apt-get update
          sudo apt-get install -y ccache git libffi-dev libssl-dev autoconf automake libtool pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo5 cmake zip unzip openjdk-17-jdk

      - name: Instalar Buildozer y Cython
        run: |
          pip install --upgrade pip
          pip install buildozer cython virtualenv kivy

      - name: Corregir Ruta de Android SDK Tools
        run: |
          # Creamos el acceso directo para que Buildozer encuentre sdkmanager
          mkdir -p /usr/local/lib/android/sdk/tools/bin
          ln -s /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager /usr/local/lib/android/sdk/tools/bin/sdkmanager

      - name: Compilar APK con Buildozer
        run: |
          # Forzamos la ejecución en el directorio actual exacto con registro detallado
          buildozer android debug --verbose

      - name: Guardar y Descargar APK
        uses: actions/upload-artifact@v4
        with:
          name: App-Colegio-APK
          path: bin/*.apk
