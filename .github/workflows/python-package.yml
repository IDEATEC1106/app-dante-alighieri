name: Compilar APK con Buildozer

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Descargar Codigo del Repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Instalar Dependencias del Sistema
        run: |
          sudo apt-get update
          sudo apt-get install -y ccache git libffi-dev libssl-dev autoconf automake libtool pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo5 cmake zip unzip openjdk-17-jdk

      - name: Instalar Buildozer y Cython
        run: |
          pip install --upgrade pip
          pip install buildozer cython virtualenv kivy

      - name: Compilar APK con Auto-Aceptacion de Licencias
        run: |
          # El parametro --verbose nos mostrara el error real directamente si algo falla
          export AutoAcceptSDK=yes
          buildozer android debug --verbose
